# 推送 v* 标签时编译 Windows 发布包并创建 GitHub Release；手动运行时只打包，产物在 Actions 里下载。
# 在 GitHub 的机器上编译，exe 里不会带进维护者本机的路径。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # setup-uv 从 v8 起不再提供 @v10 这类浮动标签，必须写完整版本
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.22" # 发布包里附带的 uv 版本，首次运行时用它建 Python 环境
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target/release-dist
      - name: Build package
        shell: pwsh
        run: ./scripts/build_release.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-Item dist/*.zip).FullName
          gh release create $env:GITHUB_REF_NAME $zip dist/SHA256SUMS.txt `
            --title "Local Photo Search $env:GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md
